user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_cache_status"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=lab_cache:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend_app {
        server wcd03-app:5000;
    }

    # =========================================================================
    # STATIC FOLDER CACHE RULE:
    # Any incoming URL starting with /static/ is treated as static and cached!
    # Non-static endpoints bypass the cache.
    # =========================================================================
    map $request_uri $bypass_cache {
        ~*^/static/ 0;  # 0 = CACHE this request
        default     1;  # 1 = BYPASS cache
    }

    server {
        listen 80;
        server_name localhost;

        # =====================================================================
        # VULNERABLE CACHE CONFIGURATION
        # =====================================================================
        # 1. proxy_pass has a trailing slash (/): Nginx passes normalized $uri.
        # 2. proxy_cache_key uses "$request_method$request_uri" (unique per token!).
        # 3. Cache decision evaluates $request_uri starting with /static/.
        # 4. Traversal (/static/TOKEN/..%2f..%2fprofile):
        #    - $request_uri matches /static/ (cached!)
        #    - $uri normalizes to /profile
        #    - proxy_pass forwards /profile to Flask backend!
        location / {
            proxy_pass http://backend_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache lab_cache;
            proxy_cache_key "$request_method$request_uri";
            proxy_cache_valid 200 10m;

            proxy_no_cache $bypass_cache;
            proxy_cache_bypass $bypass_cache;

            # Aggressive caching override
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Lab-Mode "Vulnerable" always;
        }
    }
}
