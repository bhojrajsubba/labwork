user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_cache_status"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=lab_cache:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend_app {
        server wcd03-app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # =====================================================================
        # SECURE CACHE CONFIGURATION
        # =====================================================================
        # Fix 1: Standard prefix matching without regex across full URL space
        # Fix 2: Never ignore upstream Cache-Control headers
        location /static/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache lab_cache;
            proxy_cache_key "$request_method$request_uri";
            proxy_cache_valid 200 10m;

            # Honors upstream Cache-Control
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Lab-Mode "Secure" always;
        }

        location / {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Cache-Status "BYPASS" always;
            add_header X-Lab-Mode "Secure" always;
        }
    }
}
