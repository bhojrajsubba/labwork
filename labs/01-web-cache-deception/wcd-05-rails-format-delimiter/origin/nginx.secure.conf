user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" raw="$request_uri" norm="$uri"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_app {
        server wcd05-app:5000;
    }

    server {
        listen 80;
        server_name _;

        # =====================================================================
        # SECURE ORIGIN CONFIGURATION
        # =====================================================================
        if ($request_uri ~* "(\.\.|%2f)") {
            return 400;
        }

        location / {
            proxy_pass http://backend_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Origin-Raw-URI $request_uri always;
            add_header X-Origin-Normalized-URI $uri always;
            add_header X-Backend-Framework "Ruby-on-Rails" always;
            add_header X-Lab-Mode "Secure" always;
        }
    }
}
