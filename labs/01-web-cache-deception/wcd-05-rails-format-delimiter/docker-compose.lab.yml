# Standalone Docker Compose for Lab 05 (Ruby on Rails Dot Format Delimiter + Cloudflare)
# Run from this directory: docker compose -f docker-compose.lab.yml up --build

services:
  wcd05-origin:
    build:
      context: ./origin
      args:
        MODE: ${MODE}
    ports:
      - "${HOST_BIND_IP}:${PORT}:80"
    env_file:
      - ../../../.env
    environment:
      - MODE=${MODE}
    depends_on:
      - wcd05-app
    restart: unless-stopped

  wcd05-app:
    build:
      context: ./app
    env_file:
      - ../../../.env
    environment:
      - MODE=${MODE}
      - SECRET_KEY=${SECRET_KEY}
      - BOT_SERVICE_URL=http://wcd05-bot:5001/visit
    restart: unless-stopped

  wcd05-bot:
    build:
      context: ./bot
    env_file:
      - ../../../.env
    environment:
      - TARGET_HOST=wcd05-origin
      - TARGET_PORT=80
    restart: unless-stopped
