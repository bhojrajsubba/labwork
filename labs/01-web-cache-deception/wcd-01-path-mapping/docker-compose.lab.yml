# Standalone Docker Compose for Lab 01 (WCD Path Mapping)
# Run from this directory: docker compose -f docker-compose.lab.yml up --build

services:
  wcd01-cache:
    build:
      context: ./cache
      args:
        MODE: ${MODE}
    ports:
      - "${HOST_BIND_IP}:${PORT}:80"
    env_file:
      - ../../../.env
    environment:
      - MODE=${MODE}
    depends_on:
      - wcd01-app
    restart: unless-stopped

  wcd01-app:
    build:
      context: ./app
    env_file:
      - ../../../.env
    environment:
      - MODE=${MODE}
      - SECRET_KEY=${SECRET_KEY}
      - BOT_SERVICE_URL=http://wcd01-bot:5001/visit
    restart: unless-stopped

  wcd01-bot:
    build:
      context: ./bot
    env_file:
      - ../../../.env
    environment:
      - TARGET_HOST=wcd01-cache
      - TARGET_PORT=80
    restart: unless-stopped
