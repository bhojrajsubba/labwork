# Standalone Docker Compose for Lab 01 (WCD Path Mapping)
# Run from this directory: docker compose -f docker-compose.lab.yml up --build

services:
  wcd-cache:
    build:
      context: ./cache
      args:
        MODE: ${WCD_MODE:-vulnerable}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${WCD_PORT:-8080}:80"
    environment:
      - MODE=${WCD_MODE:-vulnerable}
    depends_on:
      - wcd-app
    restart: unless-stopped

  wcd-app:
    build:
      context: ./app
    environment:
      - MODE=${WCD_MODE:-vulnerable}
      - SECRET_KEY=${SECRET_KEY:-lab_secret_key_change_in_production_123456}
      - BOT_SERVICE_URL=http://wcd-bot:5001/visit
    restart: unless-stopped

  wcd-bot:
    build:
      context: ./bot
    environment:
      - TARGET_HOST=wcd-cache
      - TARGET_PORT=80
    restart: unless-stopped
