user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_cache_status"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Define proxy cache zone
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=lab_cache:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend_app {
        server wcd-app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # =====================================================================
        # VULNERABLE CACHE CONFIGURATION
        # =====================================================================
        # Flaw 1: Caches based purely on regex match of file extensions (.css, .js, etc.)
        # Flaw 2: proxy_ignore_headers tells Nginx to disregard backend's Cache-Control, Expires, Set-Cookie, AND Vary
        #         (Many real-world CDNs by default ignore Vary: Cookie on static extensions!)
        # Flaw 3: Caches 200 OK responses regardless of cookies in request
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache lab_cache;
            # Cache key uses request_uri so any client accessing the same URI path shares the cache
            proxy_cache_key "$request_method$request_uri";
            # Only cache successful 200 OK responses (do not cache redirects)
            proxy_cache_valid 200 10m;

            # Aggressive caching override: ignores upstream cache headers AND Vary
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

            # Informative header indicating cache HIT / MISS / EXPIRED
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Lab-Mode "Vulnerable" always;
        }

        # Dynamic and default routes pass through without caching
        location / {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Cache-Status "BYPASS" always;
            add_header X-Lab-Mode "Vulnerable" always;
        }
    }
}
