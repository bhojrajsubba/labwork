# Standalone Docker Compose for Lab 02 (WCD Delimiter Discrepancy - Semicolon)
# Run from this directory: docker compose -f docker-compose.lab.yml up --build

services:
  wcd02-cache:
    build:
      context: ./cache
      args:
        MODE: ${MODE}
    ports:
      - "${HOST_BIND_IP}:${PORT}:80"
    env_file:
      - ../../../.env
    environment:
      - MODE=${MODE}
    depends_on:
      - wcd02-app
    restart: unless-stopped

  wcd02-app:
    build:
      context: ./app
    env_file:
      - ../../../.env
    environment:
      - MODE=${MODE}
      - SECRET_KEY=${SECRET_KEY}
      - BOT_SERVICE_URL=http://wcd02-bot:5001/visit
    restart: unless-stopped

  wcd02-bot:
    build:
      context: ./bot
    env_file:
      - ../../../.env
    environment:
      - TARGET_HOST=wcd02-cache
      - TARGET_PORT=80
    restart: unless-stopped
