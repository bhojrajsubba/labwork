# Standalone Docker Compose for Lab 02 (WCD Delimiter Discrepancy - Semicolon)
# Run from this directory: docker compose -f docker-compose.lab.yml up --build

services:
  wcd02-cache:
    build:
      context: ./cache
      args:
        MODE: ${WCD02_MODE:-vulnerable}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${WCD02_PORT:-8081}:80"
    environment:
      - MODE=${WCD02_MODE:-vulnerable}
    depends_on:
      - wcd02-app
    restart: unless-stopped

  wcd02-app:
    build:
      context: ./app
    environment:
      - MODE=${WCD02_MODE:-vulnerable}
      - SECRET_KEY=${SECRET_KEY:-lab_secret_key_change_in_production_123456}
      - BOT_SERVICE_URL=http://wcd02-bot:5001/visit
    restart: unless-stopped

  wcd02-bot:
    build:
      context: ./bot
    environment:
      - TARGET_HOST=wcd02-cache
      - TARGET_PORT=80
    restart: unless-stopped
