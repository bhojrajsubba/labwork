{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border">
      <div class="card-header bg-dark text-white fw-bold text-center py-3">
        Sign in to NovaCorp Financial Ledger
      </div>
      <div class="card-body p-4">
        <form method="POST" action="/login">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="attacker" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-warning fw-bold text-dark">Sign In</button>
          </div>
        </form>

        <div class="mt-4 pt-3 border-top small text-muted">
          <strong>Testing credentials:</strong>
          <ul class="mb-0 mt-1">
            <li>Attacker: <code>attacker</code> / <code>attacker123</code></li>
            <li>Victim: <code>victim</code> / <code>P@sswordVictim2026!</code></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
