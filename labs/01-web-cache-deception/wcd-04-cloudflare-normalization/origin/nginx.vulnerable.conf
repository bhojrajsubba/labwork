user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" raw="$request_uri" norm="$uri"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_app {
        server wcd04-app:5000;
    }

    server {
        listen 80;
        server_name _;

        # =====================================================================
        # VULNERABLE ORIGIN CONFIGURATION (Behind Cloudflare CDN)
        # =====================================================================
        # Nginx performs NO caching here — Cloudflare handles edge caching.
        #
        # Because proxy_pass includes a trailing slash (/):
        #   - Nginx decodes percent-encoded slashes (%2f / %2F -> /)
        #   - Nginx resolves dot segments (..) into normalized $uri
        #   - Example: /static/token/..%2F..%2Fprofile -> forwarded as /profile
        #
        # Cloudflare by default does NOT normalize %2f (or .. when URL
        # normalization is disabled), so Cloudflare matches its /static/*
        # cache rule, forwards the raw traversal path to Nginx, Nginx
        # normalizes it to /profile, and Cloudflare caches the victim's page!
        location / {
            proxy_pass http://backend_app/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Diagnostic headers to observe Cloudflare vs Nginx URI discrepancy
            add_header X-Origin-Raw-URI $request_uri always;
            add_header X-Origin-Normalized-URI $uri always;
            add_header X-Lab-Mode "Vulnerable" always;
        }
    }
}
