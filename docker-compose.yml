services:
  # ==========================================
  # Lab 01: Web Cache Deception (Path Mapping)
  # Profile: wcd-01
  # ==========================================
  wcd-cache:
    build:
      context: ./labs/01-web-cache-deception/wcd-01-path-mapping/cache
      args:
        MODE: ${WCD_MODE:-vulnerable}
    profiles: ["wcd-01"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${WCD_PORT:-8080}:80"
    environment:
      - MODE=${WCD_MODE:-vulnerable}
    depends_on:
      - wcd-app
    networks:
      - wcd-net
    restart: unless-stopped

  wcd-app:
    build:
      context: ./labs/01-web-cache-deception/wcd-01-path-mapping/app
    profiles: ["wcd-01"]
    environment:
      - MODE=${WCD_MODE:-vulnerable}
      - SECRET_KEY=${SECRET_KEY:-lab_secret_key_change_in_production_123456}
      - BOT_SERVICE_URL=http://wcd-bot:5001/visit
    networks:
      - wcd-net
    restart: unless-stopped

  wcd-bot:
    build:
      context: ./labs/01-web-cache-deception/wcd-01-path-mapping/bot
    profiles: ["wcd-01"]
    environment:
      - TARGET_HOST=wcd-cache
      - TARGET_PORT=80
    networks:
      - wcd-net
    restart: unless-stopped

networks:
  wcd-net:
    driver: bridge
