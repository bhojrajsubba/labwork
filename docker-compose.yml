services:
  # ==========================================
  # Lab 01: Web Cache Deception (Path Mapping)
  # Profile: wcd-01
  # ==========================================
  wcd01-cache:
    build:
      context: ./labs/01-web-cache-deception/wcd-01-path-mapping/cache
      args:
        MODE: ${MODE}
    profiles: ["wcd-01"]
    ports:
      - "${HOST_BIND_IP}:${PORT}:80"
    env_file:
      - .env
    environment:
      - MODE=${MODE}
    depends_on:
      - wcd01-app
    networks:
      - wcd01-net
    restart: unless-stopped

  wcd01-app:
    build:
      context: ./labs/01-web-cache-deception/wcd-01-path-mapping/app
    profiles: ["wcd-01"]
    env_file:
      - .env
    environment:
      - MODE=${MODE}
      - SECRET_KEY=${SECRET_KEY}
      - BOT_SERVICE_URL=http://wcd01-bot:5001/visit
    networks:
      - wcd01-net
    restart: unless-stopped

  wcd01-bot:
    build:
      context: ./labs/01-web-cache-deception/wcd-01-path-mapping/bot
    profiles: ["wcd-01"]
    env_file:
      - .env
    environment:
      - TARGET_HOST=wcd01-cache
      - TARGET_PORT=80
    networks:
      - wcd01-net
    restart: unless-stopped

  # ==========================================
  # Lab 02: Web Cache Deception (Delimiter Discrepancy - Semicolon)
  # Profile: wcd-02
  # ==========================================
  wcd02-cache:
    build:
      context: ./labs/01-web-cache-deception/wcd-02-delimiter/cache
      args:
        MODE: ${MODE}
    profiles: ["wcd-02"]
    ports:
      - "${HOST_BIND_IP}:${PORT}:80"
    env_file:
      - .env
    environment:
      - MODE=${MODE}
    depends_on:
      - wcd02-app
    networks:
      - wcd02-net
    restart: unless-stopped

  wcd02-app:
    build:
      context: ./labs/01-web-cache-deception/wcd-02-delimiter/app
    profiles: ["wcd-02"]
    env_file:
      - .env
    environment:
      - MODE=${MODE}
      - SECRET_KEY=${SECRET_KEY}
      - BOT_SERVICE_URL=http://wcd02-bot:5001/visit
    networks:
      - wcd02-net
    restart: unless-stopped

  wcd02-bot:
    build:
      context: ./labs/01-web-cache-deception/wcd-02-delimiter/bot
    profiles: ["wcd-02"]
    env_file:
      - .env
    environment:
      - TARGET_HOST=wcd02-cache
      - TARGET_PORT=80
    networks:
      - wcd02-net
    restart: unless-stopped

  # ==========================================
  # Lab 03: Web Cache Deception (Path Traversal & Static Normalization)
  # Profile: wcd-03
  # ==========================================
  wcd03-cache:
    build:
      context: ./labs/01-web-cache-deception/wcd-03-path-traversal-delimiter/cache
      args:
        MODE: ${MODE}
    profiles: ["wcd-03"]
    ports:
      - "${HOST_BIND_IP}:${PORT}:80"
    env_file:
      - .env
    environment:
      - MODE=${MODE}
    depends_on:
      - wcd03-app
    networks:
      - wcd03-net
    restart: unless-stopped

  wcd03-app:
    build:
      context: ./labs/01-web-cache-deception/wcd-03-path-traversal-delimiter/app
    profiles: ["wcd-03"]
    env_file:
      - .env
    environment:
      - MODE=${MODE}
      - SECRET_KEY=${SECRET_KEY}
      - BOT_SERVICE_URL=http://wcd03-bot:5001/visit
    networks:
      - wcd03-net
    restart: unless-stopped

  wcd03-bot:
    build:
      context: ./labs/01-web-cache-deception/wcd-03-path-traversal-delimiter/bot
    profiles: ["wcd-03"]
    env_file:
      - .env
    environment:
      - TARGET_HOST=wcd03-cache
      - TARGET_PORT=80
    networks:
      - wcd03-net
    restart: unless-stopped

networks:
  wcd01-net:
    driver: bridge
  wcd02-net:
    driver: bridge
  wcd03-net:
    driver: bridge
